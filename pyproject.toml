[project]
name = "p-bot"
version = "0.1.0"
description = "Hirst Lab purchasing bot for Slack"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = isort.
select = ["E", "F", "I"]
# E501 (line length > 120) is deliberately ignored: long lines are mostly Block Kit
# dictionaries and message strings where hard wrapping hurts readability.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Every module in src/ uses the try/except ImportError relative-import shim that
# makes the PyInstaller build work, which puts imports after a statement.
"src/*.py" = ["E402"]
# The entry point puts src/ on sys.path before importing from it.
"app.py" = ["E402"]
# Tests put src/ on sys.path before importing from it.
"tests/*.py" = ["E402"]

